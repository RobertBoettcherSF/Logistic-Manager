<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Swift Drive</title>
<meta name="theme-color" content="#0a7a3e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Swift Drive">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="top">
  <div class="brand">Swift<b>Drive</b> <span class="ver" id="ver"></span></div>
  <div class="roles"><button id="roleC" class="on">Customer</button><button id="roleD">Driver</button></div>
  <button id="verifyBtn" class="chip">Verify</button>
  <button id="reportBtn" class="chip rep">Report</button>
</header>
<div id="syncBar"></div>
<div id="nojs" style="padding:24px 16px;font:18px/1.4 -apple-system,sans-serif;background:#fff3cd;color:#222;border-bottom:2px solid #c90">This preview can't run the app. Open the link in Safari or Chrome.</div>
<div id="map"></div>
<div id="maperr" style="display:none;padding:8px 12px;background:#fdd;color:#900;font:14px sans-serif">Map tiles could not load (offline or blocked). Demo still works: tap the grey area to set pickup and destination.</div>
<section id="sheet"></section>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<script src="vendor/leaflet.js"></script>
<script src="report.js"></script>
<script src="sync.js"></script>
<script src="app.js"></script>
</body>
</html>
